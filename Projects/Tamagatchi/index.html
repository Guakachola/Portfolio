<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tamagatchi Terminal</title>
  <!-- <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/xterm.min.css"
  /> -->
  <link rel="stylesheet" href="xterm/xterm.css" />
<script src="xterm/xterm.js"></script>


  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #terminal-container {
      flex: 1;
      background: #000;
      border: 1px solid #0f0;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }
  </style>
</head>
<body>
  <h1>Tamagatchi Terminal</h1>
  <div id="terminal-container"></div>

  <script>
    let term;
    // Set up the Module configuration before loading the Emscripten code
    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) {
        if (term) {
          term.writeln(text);
        }
      },
      printErr: function(text) {
        if (term) {
          term.writeln('\x1b[31m' + text + '\x1b[0m');
        }
      },
      setStatus: function(text) {
        if (term) {
          term.writeln(text);
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (term) {
          term.writeln('Dependencies remaining: ' + left);
        }
      }
    };

    // Wait for document and scripts to load
    document.addEventListener('DOMContentLoaded', function() {
      // Make sure xterm.js is loaded
      if (typeof Terminal === 'undefined') {
        console.error('xterm.js failed to load');
        return;
      }

      // Initialize xterm.js
      term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'monospace',
        theme: {
          background: '#000',
          foreground: '#0f0',
          cursor: '#0f0'
        },
        rows: 24,
        cols: 80
      });

      // Open terminal in container
      term.open(document.getElementById('terminal-container'));
      term.focus();

      // Input buffer for WebAssembly
      let inputBuffer = [];

      // Handle terminal input
      term.onData(data => {
        for (const char of data) {
          inputBuffer.push(char.charCodeAt(0));
        }
        term.write(data);

        if (data === '\r') {
          term.write('\n');
          inputBuffer.push('\n'.charCodeAt(0));
        }
      });


      // Add stdin handling to Module
      Module.stdin = function() {
        if (inputBuffer.length > 0) {
          return inputBuffer.shift();
        }
        return null;
      };

      // Welcome message
      term.writeln('Welcome to Tamagatchi Terminal!');
      term.writeln('Loading WebAssembly module...');
      term.writeln('Type your commands after the program loads...\n');

      // Now load the Tamagotchi code
      var script = document.createElement('script');
      script.src = 'Tamagatchi.js';
      // After adding the script element
      script.onload = () => {
        if (typeof Tamagatchi === 'function') {
          inputBuffer = [];
          Tamagatchi(Module).then(instance => {
            term.writeln('Game loaded and running!');
          });
        } else {
          term.writeln('Tamagatchi not found.');
        }
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
