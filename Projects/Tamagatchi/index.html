<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tamagotchi Terminal</title>
  <link rel="stylesheet" href="xterm/xterm.css" />
  <script src="xterm/xterm.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #0f0;
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #terminal-container {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'monospace',
      theme: { background: '#000', foreground: '#0f0', cursor: '#0f0' }
    });

    term.open(document.getElementById('terminal-container'));
    term.writeln("Booting Tamagotchi...");

    // Input buffer
    let inputBuffer = [];

    // Hook terminal input
    term.onData(data => {
      for (let i = 0; i < data.length; i++) {
        const char = data[i];
        inputBuffer.push(char.charCodeAt(0));
        term.write(char);
        if (char === '\r') {
          term.write('\n');
          inputBuffer.push('\n'.charCodeAt(0));
        }
      }
    });

    // Define Module
    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) {
        term.writeln(text);
      },
      printErr: function(text) {
        term.writeln('\x1b[31m' + text + '\x1b[0m');
      },
      stdin: function() {
        return inputBuffer.length > 0 ? inputBuffer.shift() : null;
      }
    };

    // Load the Emscripten-generated JS file
    var script = document.createElement('script');
    script.src = "Tamagatchi.js";  // Must match your `-o Tamagatchi.js` output name
    document.body.appendChild(script);
  </script>
</body>
</html>
