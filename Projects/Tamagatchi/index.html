<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tamagatchi Debug</title>
  <script src="xterm/xterm.js"></script>
  <link rel="stylesheet" href="xterm/xterm.css" />
</head>
<body>
  <h1>Tamagatchi Debug Terminal</h1>
  <div id="terminal-container"></div>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      theme: { background: '#000', foreground: '#0f0' },
      rows: 24,
      cols: 80,
    });
    term.open(document.getElementById('terminal-container'));

    const inputBuffer = [];
    term.onData(data => {
      for (let ch of data) inputBuffer.push(ch.charCodeAt(0));
      if (data === '\r') {
        inputBuffer.push(10);
        term.write('\r\n');
      } else {
        term.write(data);
      }
      // Notify WASM runtime that new input is available:
      if (Module._emscripten_notify_input) {
        Module._emscripten_notify_input();
      }
    });


    var Module = {
      print: text => term.writeln(text),
      printErr: err => term.writeln('\x1b[31m' + err + '\x1b[0m'),
      stdin: () => inputBuffer.length ? inputBuffer.shift() : -1,
      onRuntimeInitialized: () => {
        term.writeln('🚀 WASM Runtime initialized');
      },
      onAbort: msg => term.writeln('\x1b[31mABORT: ' + msg + '\x1b[0m'),
      setStatus: status => term.writeln('STATUS: ' + status),
      monitorRunDependencies: left => term.writeln(`Dependencies left: ${left}`),
    };

    term.writeln('Loading WASM...');

    const script = document.createElement('script');
    script.src = 'Tamagatchi.js';
    script.onload = () => term.writeln('✅ Tamagatchi.js loaded');
    script.onerror = () => term.writeln('\x1b[31mFailed to load Tamagatchi.js\x1b[0m');
    document.body.appendChild(script);
  </script>
</body>
</html>
