<!DOCTYPE html>
<html>
<head>
  <title>Tamagotchi Terminal</title>
  <style>
    /* Your existing styles */
  </style>
</head>
<body>
  <h1>Tamagotchi Terminal</h1>
  <div id="terminal"></div>
  <input id="command" autocomplete="off" placeholder="Type input and hit Enter..." />
  
  <script src="Tamagatchi.js"></script>
  <script>
    const terminal = document.getElementById('terminal');
    const inputField = document.getElementById('command');
    let inputBuffer = [];

    function appendToTerminal(text) {
      terminal.textContent += text + "\n";
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Override Module's print functions to use our terminal
    Module = {
      print: appendToTerminal,
      printErr: appendToTerminal,
      stdin: function() {
        if (inputBuffer.length > 0) {
          return inputBuffer.shift();
        }
        return null;
      },
      onRuntimeInitialized: function() {
        // Program is ready
        appendToTerminal("Tamagotchi terminal ready!");
      }
    };

    inputField.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const userInput = inputField.value;
        appendToTerminal("> " + userInput);
        
        // Convert input to ASCII codes and push to buffer
        for (let i = 0; i < userInput.length; i++) {
          inputBuffer.push(userInput.charCodeAt(i));
        }
        inputBuffer.push(10); // Newline character
        
        inputField.value = '';
      }
    });
  </script>
</body>
</html>
