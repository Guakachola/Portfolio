<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tamagatchi</title>
  <style>
    body { background: #111; color: #0f0; font-family: monospace; padding: 1rem; }
    pre { background: #000; padding: 1rem; border: 1px solid #0f0; max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Tamagatchi Terminal</h1>
  <pre id="output"></pre>

  <script>
    var outputElement = document.getElementById('output');

    function printToScreen(text) {
      outputElement.textContent += text + '\n';
    }

    var Module = {
      print: printToScreen,
      printErr: printToScreen,

      // Optional: replace prompt with browser prompt for stdin
      stdin: function() {
        return prompt("Input:").charCodeAt(0); // basic single-char input
      }
    };
  </script>

  <script src="Tamagatchi.js"></script>
</body>
</html>
