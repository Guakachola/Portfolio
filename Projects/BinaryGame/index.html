<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="title-screen">
        <h1>Binary Game</h1>
        <button class="game-button" id="start-button"> Start Game </button>
        <button class="game-button" id="options-button"> Options </button>
    </div>
    <div id="game-options" style="display: none">
        <button class="game-button" id="timed">Timed Attack</button>
        <button class="game-button" id="normal">Normal Mode</button>
        <button class="game-button" id="back">Back</button>

    </div>
    <div class="game-container" id="game-ui" style="display: none">
    <div class="target-info">
        <div id="col-target">Row Target:</div>
        <div id="row-target">Column Target:</div>
    </div>
   <div style="display: flex; flex-direction: column; align-items: center;">
        
    <div style="display: flex; margin-bottom: 5px;">
        <div style="width: 50px;"></div>
        <div id="col-bits"></div>
    </div>

    <div style="display: flex;">
        <div id="row-bits"></div>
        <div id="grid"></div>
    </div>
</div>
    <div class="points">
        <div id="scoreboard">Score: 0</div>
        <div id="status">Use the arrow keys to start!</div>
    </div>


    <script src="script.js"></script>
</body>
</html>
